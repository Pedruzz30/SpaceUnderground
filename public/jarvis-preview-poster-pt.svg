    <text x="1392" y="54" fill="#fde68a" font-size="24" text-anchor="end">21:42:17</text>
    <text x="1392" y="82" fill="#a68b56" font-size="13" text-anchor="end">SEX, 04 SET 2026</text>
    <line x1="48" y1="138" x2="1392" y2="138" stroke="#5a3a08"/>

    <g transform="translate(720 312)" fill="none" stroke="#f59e0b">
      <circle r="170" stroke-width="2"/>
      <circle r="138" stroke-dasharray="10 9" opacity=".7"/>
      <circle r="104" opacity=".9"/>
      <circle r="72" stroke="#fbbf24"/>
      <circle r="48" stroke="#fbbf24" stroke-width="2"/>
      <circle r="25" fill="url(#core)" stroke="#fde68a" stroke-width="2" filter="url(#glow)"/>
      <path d="M-158 0H-120M120 0H158M0-158V-120M0 120V158" opacity=".7"/>
    </g>

    <g fill="#a68b56" font-size="13">
