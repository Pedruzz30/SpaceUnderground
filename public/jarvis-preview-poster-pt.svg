        <text x="521" y="634">02 / AMBIENTE</text><text x="919" y="634" text-anchor="end" fill="#fde68a">RELATÓRIO DO TEMPO</text>
        <text x="980" y="634">03 / SISTEMA</text><text x="1378" y="634" text-anchor="end" fill="#fde68a">MEDIDORES DO SISTEMA</text>
        <text x="62" y="766">04 / PRODUTIVIDADE</text><text x="460" y="766" text-anchor="end" fill="#fde68a">TAREFAS</text>
        <text x="521" y="766">05 / INTELIGÊNCIA</text><text x="919" y="766" text-anchor="end" fill="#fde68a">CHAT DO JARVIS</text>
        <text x="980" y="766">06 / ARMAZENAMENTO</text><text x="1378" y="766" text-anchor="end" fill="#fde68a">ARQUIVOS</text>
