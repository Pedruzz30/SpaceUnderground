<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">JARVIS — ambiente de IA para desktop</title>
  <desc id="desc">Prévia dourada do protótipo JARVIS da SPACE UNDERGROUND, com núcleo holográfico e painéis de sistema.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#3a2908" stroke-width="1" opacity=".55"/>
    </pattern>
    <radialGradient id="core" cx="38%" cy="32%">
      <stop offset="0" stop-color="#fff7cc"/>
      <stop offset=".18" stop-color="#fbbf24"/>
      <stop offset=".55" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#5b3004"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1440" height="900" fill="#0f0a02"/>
  <rect width="1440" height="900" fill="url(#grid)"/>
  <g font-family="ui-monospace,Consolas,monospace">
