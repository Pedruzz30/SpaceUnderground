name: Validate Pull Request

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-site:
    name: Public site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install public dependencies
        run: npm ci

      - name: Run public unit tests
        run: npm test

      - name: Validate static JavaScript
        run: find public -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check

      - name: Build public site
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run public viewer E2E
        env:
          VITE_SUPABASE_URL: https://fixture.supabase.co
          VITE_SUPABASE_ANON_KEY: fixture-public-key
          BASE_URL: http://127.0.0.1:5173
        run: |
          npm run dev > /tmp/space-underground-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/space-underground-vite.log
            exit 1
          fi
          npm run test:e2e:viewer

  admin:
    name: Admin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install admin dependencies
        run: npm ci

      - name: Run admin tests
        run: npm test
        env:
          VITE_ADMIN_DATA_SOURCE: mock
          VITE_ADMIN_ALLOW_MOCK_BUILD: "true"

      - name: Build admin
        run: npm run build
        env:
          VITE_ADMIN_DATA_SOURCE: mock
          VITE_ADMIN_ALLOW_MOCK_BUILD: "true"
