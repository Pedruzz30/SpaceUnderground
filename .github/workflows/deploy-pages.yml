name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  # Confere o site que ficou realmente publicado. Sem isso o deploy pode
  # "passar" e o site ficar quebrado no ar sem ninguem perceber.
  verify:
    name: Verificar o site publicado
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      # Checagem deterministica, feita primeiro porque diagnostica a causa raiz.
      #
      # Quando a origem do Pages esta em "Deploy from a branch", o GitHub roda um
      # builder proprio ("pages build and deployment") ALEM deste workflow. Os
      # dois publicam no mesmo commit e vale o que terminar por ultimo -- o
      # automatico costuma vencer por poucos segundos e serve a raiz do
      # repositorio no lugar do dist/.
      #
      # Nao da para checar isso so olhando o site: existe uma janela de alguns
      # segundos em que o conteudo certo esta no ar antes de ser sobrescrito.
      # Por isso a pergunta aqui e "o builder concorrente rodou?", nao "o que
      # esta no ar agora?".
      - name: Detectar builder concorrente do Pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          resposta=$(curl -sf --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/runs?head_sha=$SHA&per_page=100") || {
              echo "::warning::Nao foi possivel consultar a API de runs; pulando esta checagem."
              exit 0
            }

          # Contagem em shell puro de proposito: um jq que falhasse deixaria
          # a variavel vazia e o check passaria em silencio, que e exatamente
          # o tipo de falha que este job existe para impedir.
          rivais=$(printf '%s' "$resposta" | grep -c '"pages build and deployment"' || true)

          if [ "${rivais:-0}" -gt 0 ]; then
            echo "::error::Existe um builder automatico do Pages publicando neste mesmo commit, competindo com este workflow. Quem termina por ultimo vence, entao o site pode ir ao ar servindo o codigo-fonte no lugar do dist/. Corrija em Settings > Pages > Build and deployment: mude Source para 'GitHub Actions'."
            exit 1
          fi

          echo "Nenhum builder concorrente. Este workflow e o unico publicando."

      - name: Conferir que o Pages esta servindo o build
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -uo pipefail
          url="${PAGE_URL%/}/"
          echo "Verificando $url"

          # O CDN do Pages leva um tempo para propagar. Tenta ate 5 min.
          html=""
          for i in $(seq 1 20); do
            html=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$url" || true)
            if printf '%s' "$html" | grep -qE 'assets/index-[A-Za-z0-9_-]+\.js'; then
              echo "Bundle detectado na tentativa $i"
              break
            fi
            sleep 15
          done

          if [ -z "$html" ]; then
            echo "::error::Nao foi possivel baixar $url"
            exit 1
          fi

          if printf '%s' "$html" | grep -qE 'src/(styles|scripts)/main\.(css|js)'; then
            echo "::error::O Pages esta servindo o codigo-fonte, nao o dist/."
            exit 1
          fi

          assets=$(printf '%s' "$html" | grep -oE 'assets/index-[A-Za-z0-9_-]+\.(css|js)' | sort -u)
          if [ -z "$assets" ]; then
            echo "::error::Nenhum bundle encontrado no HTML publicado."
            exit 1
          fi

          falhou=0
          for path in $assets .nojekyll favicon.svg og-image.png NoteBookSpaceU.png tattoo-preview-poster.png; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url$path")
            if [ "$code" = "200" ]; then
              echo "  ok   $code  $path"
            else
              echo "  FALHA $code  $path"
              falhou=1
            fi
          done

          if [ "$falhou" -ne 0 ]; then
            echo "::error::Recursos do site publicado nao responderam 200."
            exit 1
          fi

          echo "Site publicado OK: bundles, favicon e imagem de compartilhamento respondendo."
