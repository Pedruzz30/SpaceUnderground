name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  # Confere o site que ficou realmente publicado. Sem isso o deploy pode
  # "passar" e o site ficar quebrado no ar sem ninguem perceber -- foi o que
  # aconteceu quando o builder automatico do Pages venceu a corrida contra
  # este workflow e publicou o codigo-fonte no lugar do dist/.
  verify:
    name: Verificar o site publicado
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Conferir que o Pages esta servindo o build
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -uo pipefail
          url="${PAGE_URL%/}/"
          echo "Verificando $url"

          # O CDN do Pages leva um tempo para propagar. Tenta ate 5 min.
          html=""
          for i in $(seq 1 20); do
            html=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$url" || true)
            if printf '%s' "$html" | grep -qE 'assets/index-[A-Za-z0-9_-]+\.js'; then
              echo "Bundle detectado na tentativa $i"
              break
            fi
            sleep 15
          done

          if [ -z "$html" ]; then
            echo "::error::Nao foi possivel baixar $url"
            exit 1
          fi

          # O index.html publicado referencia o codigo-fonte? Entao quem
          # publicou foi o builder automatico do GitHub, nao este workflow.
          if printf '%s' "$html" | grep -qE 'src/(styles|scripts)/main\.(css|js)'; then
            echo "::error::O Pages esta servindo o codigo-fonte, nao o dist/. Em Settings > Pages > Build and deployment, mude Source para 'GitHub Actions' para desligar o builder automatico."
            exit 1
          fi

          assets=$(printf '%s' "$html" | grep -oE 'assets/index-[A-Za-z0-9_-]+\.(css|js)' | sort -u)
          if [ -z "$assets" ]; then
            echo "::error::Nenhum bundle encontrado no HTML publicado."
            exit 1
          fi

          falhou=0
          for path in $assets favicon.svg og-image.png; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url$path")
            if [ "$code" = "200" ]; then
              echo "  ok   $code  $path"
            else
              echo "  FALHA $code  $path"
              falhou=1
            fi
          done

          if [ "$falhou" -ne 0 ]; then
            echo "::error::Recursos do site publicado nao responderam 200."
            exit 1
          fi

          echo "Site publicado OK: bundles, favicon e imagem de compartilhamento respondendo."
